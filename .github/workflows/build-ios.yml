# --- .github/workflows/build-ios.yml ---
name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install iOS 18 SDK via xcodes
        run: |
          brew install xcodes
          xcodes runtimes install "iOS 18.2" || true

      - name: Resolve dependencies
        working-directory: ios
        run: swift package resolve

      - name: Build & Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -scheme Chat2API_iOS \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Chat2API.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          APP=$(find $RUNNER_TEMP/Chat2API.xcarchive \
            -name "*.app" -maxdepth 4 | head -1)
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Chat2API-unsigned.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chat2API-iOS-${{ github.sha }}
          path: $RUNNER_TEMP/Chat2API-unsigned.ipa
          retention-days: 14
